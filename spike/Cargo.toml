[package]
name = "zastava-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Спайк-гейт (см. inc/inc-1-mvp.md §5): проверяет server+client rmcp в одном
# процессе и служит стендом для контрольного плеча permissions.allow.

[dependencies]
rmcp = { version = "=3.1.3", features = ["server", "client", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
futures = "0.3"
