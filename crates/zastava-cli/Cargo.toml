[package]
name = "zastava"
description = "MCP gateway with argument-level policies, audit log and rule learning."
keywords = ["mcp", "ai", "security", "policy", "gateway"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
# В пакет НЕ едут тестовая фикстура и тесты. Иначе `cargo install zastava`
# кладёт пользователю в PATH ещё и `zastava-test-echo` — эхо-MCP-сервер,
# который нужен только нашим e2e (замечено на проверке 0.1.0 с чистой
# машины). Бенч остаётся: он часть обещания «замерь сам».
exclude = ["src/bin/", "tests/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "zastava"
path = "src/main.rs"

# Замеры M4. harness = false — цифры печатаются как отчёт, а не гоняются
# через libtest: нам нужен один прогон с разбором, а не «прошло/упало».
[[bench]]
name = "latency"
harness = false

[dependencies]
zastava-core.workspace = true
zastava-proxy.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
