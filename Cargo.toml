[workspace]
resolver = "2"
members = ["crates/zastava-core", "crates/zastava-proxy", "crates/zastava-cli"]
# Каталог crates/zastava-cli намеренно оставлен: пакет в нём называется
# `zastava` — так имя занимается на crates.io и работает `cargo install zastava`.
exclude = ["spike"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/gorka2354/zastava"
authors = ["gorka2354"]

[workspace.dependencies]
zastava-core = { path = "crates/zastava-core", version = "0.1.1" }
zastava-proxy = { path = "crates/zastava-proxy", version = "0.1.1" }
thiserror = "2"
serde_json = "1"
sha2 = "0.10"
rmcp = { version = "=3.1.3", features = ["server", "client", "transport-io", "transport-child-process", "transport-async-rw"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "time", "sync"] }
notify = "8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = { version = "0.24", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

# Контракт падения (2A): паника не оставляет полуживой гейтвей;
# уборку детей гарантирует ядро (Job Object KILL_ON_JOB_CLOSE).
[profile.release]
panic = "abort"

[profile.dev]
# Отладочная информация — только таблицы строк. Бэктрейс по-прежнему называет
# файл и номер строки (а больше нам от него ничего и не нужно: отлаживаемся
# тестами и выводом, не отладчиком), но каталог сборки худеет вдвое с лишним.
#
# Замер на одинаковой истории сборок: 5.19 ГБ против 2.11 ГБ (−59%), полная
# сборка 23 с вместо 35 с. Поводом послужил забитый под ноль системный диск:
# cargo не удаляет старые артефакты, и цена каждой лишней копии — та самая
# отладочная информация.
debug = "line-tables-only"
